<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boost Versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0f16;--card:#171926;--text:#fff;--muted:rgba(255,255,255,.55);--line:rgba(255,255,255,.08);--red:#fe2c55;--cyan:#25f4ee}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:"TikTok Sans",Inter,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:34px 16px 40px}
  .kicker{font-size:12px;font-weight:900;letter-spacing:2.5px;color:var(--cyan)}
  h1{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.05;margin-top:8px}
  h1 span{color:var(--red)}
  .count{display:inline-block;margin-top:10px;font-size:12px;font-weight:900;background:#fe2c55;color:#fff;padding:4px 10px;border-radius:10px}
  .lead{color:var(--muted);font-size:15px;margin-top:10px;line-height:1.45}
  .list{display:flex;flex-direction:column;gap:12px;margin-top:26px}
  a.card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s,border-color .2s,background .2s;animation:in .5s cubic-bezier(.2,1,.3,1) both}
  a.card:hover{border-color:rgba(255,255,255,.2);background:#1c1f2e}
  a.card:active{transform:scale(.98)}
  @keyframes in{from{opacity:0;transform:translateY(14px)}}
  .sw{position:relative;flex:0 0 62px;height:62px;border-radius:16px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .sw b{font-size:22px;font-weight:900;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
  .tx{flex:1;min-width:0}
  .tx em{display:block;font-style:normal;font-size:11px;font-weight:900;letter-spacing:1.5px;color:var(--cyan)}
  .tx b{display:block;font-size:18px;font-weight:800}
  .tx span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .go{flex:0 0 38px;height:38px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 4px 14px rgba(254,44,85,.4)}
  .note{margin-top:22px;font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
  .note b{color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">PRANK · ROCKET BOOST</div>
  <h1>Обери <span>версію</span></h1>
  <p class="count" id="count"></p>
  <p class="lead">Профіль однаковий скрізь: 120 фоловерів, 1,584 лайки. У кожної версії своя кнопка, своя механіка вибору, своє підтвердження і своя анімація накрутки.</p>
  <div class="list" id="list"></div>
  <p class="note">Пранк-екран з'являється через <b>1 хвилину</b> після першого OK.</p>
</div>
<script>
const V = [{"file": "rocket-1-launchpad.html", "name": "Launch Pad", "desc": "Паливний бак з рідиною, відлік 3-2-1 і ракета летить через екран у твої цифри", "swatch": "linear-gradient(135deg,#ffb703,#fe2c55 70%)", "icon": "⛽"}, {"file": "rocket-2-dial.html", "name": "Power Dial", "desc": "Крутиш регулятор пальцем, затискаєш кнопку — прогрес кільцем і міні-плеєр знизу", "swatch": "conic-gradient(from 220deg,#25f4ee,#7c5cff,#fe2c55,#25f4ee)", "icon": "🎛"}, {"file": "rocket-3-odometer.html", "name": "Odometer", "desc": "Барабан вибору як в iPhone, «slide to boost», а цифри профілю крутяться як лічильник", "swatch": "linear-gradient(135deg,#161823,#2c2f45 60%,#25f4ee)", "icon": "🔢"}, {"file": "rocket-4-packs.html", "name": "Boost Packs", "desc": "Каруселька пакетів, кнопка заливається рідиною, а аватарки й сердечка летять прямо в лічильники", "swatch": "linear-gradient(135deg,#ffe3ec,#ffd166 50%,#25f4ee)", "icon": "🎁"}, {"file": "rocket-5-chat.html", "name": "Boost Bot", "desc": "Бот у чаті сам веде: питає, що накрутити, показує чекліст і живий прогрес у повідомленнях", "swatch": "linear-gradient(135deg,#f1f1f2 0 45%,#fe2c55 45% 100%)", "icon": "💬"}, {"file": "rocket-06-giftbox.html", "name": "Gift Box", "desc": "Вибираєш подарунок, тапаєш тричі — коробка трясеться і відкривається з конфеті", "swatch": "linear-gradient(135deg,#ff7aa2,#fe2c55)", "icon": "🎁"}, {"file": "rocket-07-scratch.html", "name": "Lucky Ticket", "desc": "Лотерейний квиток: стираєш пальцем срібний шар і бачиш свій виграш", "swatch": "linear-gradient(135deg,#ffd166,#ff8a3d)", "icon": "🎟"}, {"file": "rocket-08-slots.html", "name": "Slot Machine", "desc": "Тягнеш важіль слот-машини, барабани крутяться — три однакові дають джекпот-буст", "swatch": "linear-gradient(135deg,#7c5cff,#fe2c55)", "icon": "🎰"}, {"file": "rocket-09-battery.html", "name": "Power Charge", "desc": "Тримаєш кнопку з блискавкою — батарея заряджається, чим довше, тим більше", "swatch": "linear-gradient(135deg,#1fb97a,#9be15d)", "icon": "🔋"}, {"file": "rocket-10-taprush.html", "name": "Tap Rush", "desc": "5 секунд: тапай якнайшвидше — кожен тап додає фоловерів, комбо множить", "swatch": "radial-gradient(circle at 50% 50%,#fff 0 18%,#fe2c55 19% 40%,#ffe1e8 41% 60%,#fe2c55 61%)", "icon": "👆"}, {"file": "rocket-11-slingshot.html", "name": "Slingshot", "desc": "Натягуєш рогатку з ракетою вниз і відпускаєш — сила натягу = кількість", "swatch": "linear-gradient(135deg,#8b5a2b,#d4a373 55%,#fe2c55)", "icon": "🪃"}, {"file": "rocket-12-equalizer.html", "name": "Mixer", "desc": "Мікшерний пульт: тягнеш 5 повзунків-каналів угору, сума — твій буст", "swatch": "linear-gradient(90deg,#25f4ee 0 20%,#7c5cff 20% 40%,#fe2c55 40% 60%,#ff8a3d 60% 80%,#ffd166 80%)", "icon": "🎚"}, {"file": "rocket-13-heat.html", "name": "Heat Meter", "desc": "Термометр популярності: тягнеш ртуть від ❄️ Cold до 🌋 Legendary, фон «нагрівається»", "swatch": "linear-gradient(0deg,#5ac8fa,#ffd166 50%,#fe2c55)", "icon": "🌡"}, {"file": "rocket-14-dice.html", "name": "Lucky Dice", "desc": "Кидаєш два 3D-кубики: сума × 2,500, дубль подвоює. Три кидки", "swatch": "linear-gradient(135deg,#ffffff 0 50%,#161823 50%)", "icon": "🎲"}, {"file": "rocket-15-cards.html", "name": "Pick a Card", "desc": "Три карти перемішуються, обираєш одну — вона перевертається з бустом", "swatch": "repeating-linear-gradient(45deg,#fe2c55 0 8px,#ff5277 8px 16px)", "icon": "🃏"}, {"file": "rocket-16-keypad.html", "name": "Keypad", "desc": "Набираєш точне число на клавіатурі як у банківському застосунку, кнопка перетворюється на галочку", "swatch": "linear-gradient(135deg,#161823,#3a3d55)", "icon": "🔢"}, {"file": "rocket-17-world.html", "name": "Worldwide", "desc": "Обираєш країни на глобусі — з кожної прилітає аудиторія, а прогрес видно на радарі", "swatch": "radial-gradient(circle at 35% 35%,#7dd3fc,#1a8cff 60%,#0b4fa8)", "icon": "🌍"}, {"file": "rocket-18-circle.html", "name": "Draw a Circle", "desc": "Малюєш пальцем коло: що більше і рівніше — то більший буст, з оцінкою «perfect circle»", "swatch": "radial-gradient(circle,#fff 0 46%,#fe2c55 47% 56%,#fff 57%)", "icon": "⭕"}, {"file": "rocket-19-balloon.html", "name": "Balloon Pump", "desc": "Накачуєш повітряну кульку насосом — вона росте, а потім відпускаєш її в небо", "swatch": "radial-gradient(circle at 40% 35%,#ff8fab,#fe2c55 60%,#b5102f)", "icon": "🎈"}, {"file": "rocket-20-gears.html", "name": "Gear Shift", "desc": "Перемикаєш передачі як у машині, стрілка спідометра летить угору, «Floor it» — і газ", "swatch": "linear-gradient(135deg,#2a2d40,#161823 60%,#ff6a3d)", "icon": "🏎"}, {"file": "rocket-21-elevator.html", "name": "Elevator", "desc": "Ліфт слави: тиснеш поверх, двері зачиняються, табло рахує поверхи вгору", "swatch": "linear-gradient(90deg,#c9ccd6 0 49%,#161823 49% 51%,#c9ccd6 51%)", "icon": "🛗"}, {"file": "rocket-22-bubbles.html", "name": "Bubble Pop", "desc": "Мильні бульбашки з бонусами пливуть угору — лопаєш їх і збираєш фоловерів", "swatch": "radial-gradient(circle at 30% 30%,#fff,#bdf3ff 30%,#c9b8ff 60%,#ffc2d6)", "icon": "🫧"}, {"file": "rocket-23-chart.html", "name": "Growth Chart", "desc": "Графік росту: тягнеш точку «через 7 днів» угору, крива перемальовується наживо", "swatch": "linear-gradient(160deg,#e9fbf3 0 45%,#1fb97a 45% 52%,#e9fbf3 52%)", "icon": "📈"}, {"file": "rocket-24-stopwatch.html", "name": "Stop at 3.00", "desc": "Секундомір-гра: зупини рівно на 3.00 — що точніше, то більший буст (perfect = 100K)", "swatch": "conic-gradient(#fe2c55 0 30%,#161823 30% 100%)", "icon": "⏱"}, {"file": "rocket-25-plinko.html", "name": "Plinko", "desc": "Кидаєш 3 кульки на дошку з кілочками — куди впаде, стільки й отримаєш (до 50K за кульку)", "swatch": "radial-gradient(circle,#161823 0 18%,transparent 19%) 0 0/14px 14px,linear-gradient(180deg,#f3efff,#ffd6e0)", "icon": "🔻"}];
const list = document.getElementById('list');
document.getElementById('count').textContent = V.length + ' версій';
V.forEach((v, i) => {
  const a = document.createElement('a');
  a.className = 'card'; a.href = v.file; a.style.animationDelay = (Math.min(i, 8) * 50) + 'ms';
  a.innerHTML = '<div class="sw" style="background:' + v.swatch + '"><b>' + v.icon + '</b></div>' +
    '<div class="tx"><em>#' + String(i + 1).padStart(2, '0') + '</em><b></b><span></span></div>' +
    '<div class="go"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></div>';
  a.querySelector('.tx b').textContent = v.name;
  a.querySelector('.tx span').textContent = v.desc;
  list.appendChild(a);
});
</script>
</body>
</html>
